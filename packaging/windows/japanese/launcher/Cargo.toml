[workspace]

[package]
name = "photocraft-ja-package"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
sha2 = "0.10"
zip = { version = "=9.1.0", default-features = false, features = ["deflate"] }
winsafe = { version = "=0.0.29", default-features = false, features = ["user"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
